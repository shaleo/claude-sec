[project]
name = "claude-sec"
version = "0.1.0"
description = "Security audit dashboard for Claude Code configurations"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "rich>=13.0",
]

[project.scripts]
claude-sec = "claude_sec.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_sec"]

[tool.hatch.build.targets.wheel.force-include]
"src/claude_sec/templates" = "claude_sec/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]
